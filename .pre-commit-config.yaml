repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest tests/ -q --cov=ai_spend --cov-report=term
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
